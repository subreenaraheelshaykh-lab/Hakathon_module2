<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>
    <!-- navbar -->
  <header>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid logo">
          <img src="./image/logo.png" alt="" class="logo" />
          <form class="d-flex gap-2 ms-auto nav-links" role="search">
            <a id="homebtn"    href="index.html"    class="btn btn-outline-success">Home</a>
            <a id="recipebtn"  href="allrecipes.html"  class="btn btn-outline-success">All Recipes</a>
            <a id="myrecipesbtn" href="myrecipes.html" class="btn btn-outline-success">My Recipes</a>

                      
          </form>
        </div>
      </nav>

  </header>
 
  <!-- navbar end -->




    <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-7">
            <div class="card" style="border-radius: 15px">
                <div class="card-body p-5">
                    <h2 class="text-uppercase text-center mb-5">Create an account</h2>

                    <form>
                        <div data-mdb-input-init="" class="form-outline mb-4" data-mdb-input-initialized="true">
                            <input type="email" id="email" class="form-control form-control-lg" />
                            <label class="form-label" for="form3Example3cg" style="margin-left: 0px">Your Email</label>
                            <div class="form-notch">
                                <div class="form-notch-leading" style="width: 9px"></div>
                                <div class="form-notch-middle" style="width: 68.8px"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>

                        <div data-mdb-input-init="" class="form-outline mb-4" data-mdb-input-initialized="true">
                            <input type="password" id="password" class="form-control form-control-lg" />
                            <label class="form-label" for="form3Example4cg" style="margin-left: 0px">Password</label>
                            <div class="form-notch">
                                <div class="form-notch-leading" style="width: 9px"></div>
                                <div class="form-notch-middle" style="width: 64.8px"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>

                        <div data-mdb-input-init="" class="form-outline mb-4" data-mdb-input-initialized="true">
                            <div class="form-notch">
                                <div class="form-notch-leading" style="width: 9px"></div>
                                <div class="form-notch-middle" style="width: 134.4px"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="button" data-mdb-button-init="" data-mdb-ripple-init=""
                                class="btn btn-success btn-block btn-lg gradient-custom-4 text-body"
                                data-mdb-button-initialized="true" id="submitbtn">
                                Submit
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    








   <!-- javascript link -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="app.js"></script>
</body>
</html>
